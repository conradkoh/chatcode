name: publish-chatcode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.10)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update version
        run: |
          cd packages/chatcode
          npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: cd packages/chatcode && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
